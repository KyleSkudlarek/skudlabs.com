<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none" role="img" aria-label="A messy stack of paperwork flowing through an automation step into clean, organized data">
  <!-- Automation value-prop: messy inputs (left) → glowing automation node
       (center) → clean, organized output (right). Low-poly, palette-tied,
       restrained glow. Frozen — Layer 4. -->
  <defs>
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#A0B389"/>
    </marker>
  </defs>

  <!-- connectors -->
  <g stroke="#A0B389" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M150,180 H198"/>
    <path d="M282,180 H330"/>
  </g>

  <!-- LEFT: messy stack of invoices/paperwork -->
  <g>
    <rect x="60" y="118" width="78" height="108" rx="3" fill="#26343d" stroke="#3c5560" stroke-width="2" transform="rotate(-11 99 172)"/>
    <rect x="60" y="118" width="78" height="108" rx="3" fill="#2f414b" stroke="#43606c" stroke-width="2" transform="rotate(-3 99 172)"/>
    <g transform="rotate(7 99 172)">
      <rect x="60" y="118" width="78" height="108" rx="3" fill="#39515c" stroke="#5a7a86" stroke-width="2"/>
      <!-- folded corner -->
      <path d="M126,118 L138,118 L138,130 Z" fill="#26343d"/>
      <!-- invoice lines -->
      <rect x="70" y="132" width="40" height="7" rx="2" fill="#FEDDAA" opacity="0.55"/>
      <rect x="70" y="150" width="58" height="5" rx="2" fill="#8B8B8C"/>
      <rect x="70" y="162" width="58" height="5" rx="2" fill="#8B8B8C"/>
      <rect x="70" y="174" width="44" height="5" rx="2" fill="#8B8B8C"/>
      <rect x="70" y="198" width="30" height="9" rx="2" fill="#A0B389" opacity="0.8"/>
    </g>
  </g>

  <!-- CENTER: automation node (glowing olivine hexagon) -->
  <g filter="url(#nodeGlow)">
    <polygon points="206,180 223,151 257,151 274,180 257,209 223,209" fill="#A0B389"/>
  </g>
  <polygon points="206,180 223,151 257,151 274,180 257,209 223,209" fill="#A0B389" stroke="#c2d1ad" stroke-width="1.5"/>
  <!-- processing spark -->
  <g stroke="#15252f" stroke-width="3" stroke-linecap="round">
    <path d="M240,166 V194"/>
    <path d="M226,180 H254"/>
    <path d="M230,170 L250,190"/>
    <path d="M250,170 L230,190"/>
  </g>
  <circle cx="240" cy="180" r="6" fill="#15252f"/>

  <!-- RIGHT: clean, organized output (tidy table + check) -->
  <g>
    <rect x="336" y="120" width="112" height="120" rx="6" fill="#13242e" stroke="#A0B389" stroke-width="2"/>
    <!-- header row -->
    <rect x="336" y="120" width="112" height="22" rx="6" fill="#A0B389" opacity="0.22"/>
    <rect x="347" y="127" width="34" height="8" rx="2" fill="#FAFBFC" opacity="0.85"/>
    <rect x="395" y="127" width="42" height="8" rx="2" fill="#FAFBFC" opacity="0.5"/>
    <!-- column divider -->
    <path d="M388,142 V240" stroke="#274350" stroke-width="1.5"/>
    <!-- rows -->
    <g>
      <path d="M336,164 H448 M336,188 H448 M336,212 H448" stroke="#274350" stroke-width="1.5"/>
      <g fill="#8B8B8C">
        <rect x="347" y="150" width="28" height="6" rx="2"/>
        <rect x="347" y="174" width="28" height="6" rx="2"/>
        <rect x="347" y="198" width="28" height="6" rx="2"/>
        <rect x="347" y="222" width="28" height="6" rx="2"/>
      </g>
      <g fill="#A0B389" opacity="0.85">
        <rect x="398" y="150" width="34" height="6" rx="2"/>
        <rect x="398" y="174" width="26" height="6" rx="2"/>
        <rect x="398" y="198" width="34" height="6" rx="2"/>
        <rect x="398" y="222" width="22" height="6" rx="2"/>
      </g>
    </g>
    <!-- approved check badge -->
    <circle cx="440" cy="124" r="15" fill="#A0B389" stroke="#13242e" stroke-width="2.5"/>
    <path d="M433,124 L438,129 L448,118" stroke="#15252f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
