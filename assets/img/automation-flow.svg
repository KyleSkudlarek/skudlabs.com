<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" fill="none" role="img" aria-label="Messy paperwork feeding an AI hub that produces a website and app, a support chat, a dashboard, and clean organized data">
  <!-- Value-prop bloom: messy inputs (left) feed a glowing AI/software hub
       (center) that produces multiple outcomes — website + app, support chat,
       dashboard, and organized data. Low-poly, palette-tied, restrained glow. -->
  <defs>
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#A0B389"/>
    </marker>
  </defs>

  <!-- connectors: consistent gap at both ends -->
  <g stroke="#A0B389" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M126,228 L205,222"/>            <!-- papers → hub -->
    <path d="M252,184 L250,150"/>            <!-- hub → website/app -->
    <path d="M300,214 L392,193"/>            <!-- hub → support chat -->
    <path d="M283,250 L396,288"/>            <!-- hub → organized data -->
    <path d="M256,258 L257,293"/>            <!-- hub → dashboard -->
  </g>

  <!-- INPUT: messy stack of invoices/paperwork -->
  <g transform="translate(-30,58)">
    <rect x="60" y="118" width="74" height="102" rx="3" fill="#26343d" stroke="#3c5560" stroke-width="2" transform="rotate(-11 97 169)"/>
    <rect x="60" y="118" width="74" height="102" rx="3" fill="#2f414b" stroke="#43606c" stroke-width="2" transform="rotate(-3 97 169)"/>
    <g transform="rotate(7 97 169)">
      <rect x="60" y="118" width="74" height="102" rx="3" fill="#39515c" stroke="#5a7a86" stroke-width="2"/>
      <path d="M122,118 L134,118 L134,130 Z" fill="#26343d"/>
      <rect x="70" y="132" width="38" height="7" rx="2" fill="#FEDDAA" opacity="0.55"/>
      <rect x="70" y="149" width="54" height="5" rx="2" fill="#8B8B8C"/>
      <rect x="70" y="161" width="54" height="5" rx="2" fill="#8B8B8C"/>
      <rect x="70" y="173" width="42" height="5" rx="2" fill="#8B8B8C"/>
      <rect x="70" y="196" width="28" height="9" rx="2" fill="#A0B389" opacity="0.8"/>
    </g>
  </g>

  <!-- HUB: AI / software engine (glowing olivine hexagon) -->
  <g transform="translate(15,40)">
    <g filter="url(#nodeGlow)">
      <polygon points="206,180 223,151 257,151 274,180 257,209 223,209" fill="#A0B389"/>
    </g>
    <polygon points="206,180 223,151 257,151 274,180 257,209 223,209" fill="#A0B389" stroke="#c2d1ad" stroke-width="1.5"/>
    <g stroke="#15252f" stroke-width="3" stroke-linecap="round">
      <path d="M240,166 V194"/><path d="M226,180 H254"/>
      <path d="M230,170 L250,190"/><path d="M250,170 L230,190"/>
    </g>
    <circle cx="240" cy="180" r="6" fill="#15252f"/>
  </g>

  <!-- OUTPUT 1 (top): website + app — laptop & phone -->
  <g>
    <rect x="158" y="22" width="184" height="96" rx="7" fill="#2a3a44" stroke="#48646f" stroke-width="2"/>
    <rect x="166" y="30" width="168" height="80" rx="3" fill="#11212b"/>
    <rect x="166" y="30" width="168" height="14" fill="#A0B389" opacity="0.22"/>
    <circle cx="176" cy="37" r="3" fill="#A0B389"/>
    <g fill="#FAFBFC" opacity="0.55">
      <rect x="292" y="35" width="12" height="4" rx="2"/><rect x="308" y="35" width="12" height="4" rx="2"/><rect x="324" y="35" width="6" height="4" rx="2"/>
    </g>
    <rect x="174" y="52" width="74" height="28" rx="3" fill="#FAFBFC" opacity="0.10"/>
    <rect x="174" y="86" width="58" height="6" rx="2" fill="#FAFBFC" opacity="0.7"/>
    <rect x="174" y="97" width="40" height="5" rx="2" fill="#8B8B8C"/>
    <rect x="262" y="52" width="64" height="24" rx="3" fill="#16323f"/>
    <rect x="262" y="82" width="64" height="20" rx="3" fill="#16323f"/>
    <path d="M148,118 H352 L362,132 H138 Z" fill="#33454f" stroke="#48646f" stroke-width="1.5"/>
    <rect x="232" y="121" width="32" height="3" rx="1.5" fill="#1d2e37"/>
    <!-- phone -->
    <rect x="330" y="62" width="44" height="92" rx="10" fill="#2a3a44" stroke="#48646f" stroke-width="2"/>
    <rect x="335" y="71" width="34" height="74" rx="4" fill="#11212b"/>
    <rect x="346" y="66" width="12" height="2.5" rx="1.25" fill="#48646f"/>
    <rect x="335" y="71" width="34" height="12" fill="#A0B389" opacity="0.25"/>
    <rect x="340" y="90" width="24" height="16" rx="2" fill="#FAFBFC" opacity="0.12"/>
    <rect x="340" y="112" width="24" height="5" rx="2" fill="#8B8B8C"/>
    <rect x="340" y="121" width="18" height="5" rx="2" fill="#8B8B8C"/>
    <rect x="340" y="132" width="16" height="6" rx="2" fill="#A0B389" opacity="0.8"/>
  </g>

  <!-- OUTPUT 2 (right): AI support chat -->
  <g>
    <rect x="404" y="150" width="112" height="60" rx="12" fill="#13242e" stroke="#A0B389" stroke-width="2"/>
    <path d="M418,208 L418,224 L434,208 Z" fill="#13242e" stroke="#A0B389" stroke-width="2"/>
    <rect x="418" y="166" width="64" height="6" rx="3" fill="#FAFBFC" opacity="0.7"/>
    <rect x="418" y="180" width="80" height="6" rx="3" fill="#8B8B8C"/>
    <g fill="#A0B389"><circle cx="422" cy="197" r="3"/><circle cx="434" cy="197" r="3"/><circle cx="446" cy="197" r="3"/></g>
    <!-- olivine reply bubble -->
    <rect x="452" y="208" width="60" height="30" rx="10" fill="#A0B389"/>
    <path d="M500,208 L500,222 L486,208 Z" fill="#A0B389"/>
    <rect x="460" y="219" width="44" height="5" rx="2" fill="#15252f" opacity="0.6"/>
    <rect x="460" y="228" width="30" height="5" rx="2" fill="#15252f" opacity="0.45"/>
  </g>

  <!-- OUTPUT 3 (lower-right): clean organized data (table + check) -->
  <g transform="translate(122,176) scale(0.85)">
    <rect x="336" y="120" width="112" height="120" rx="6" fill="#13242e" stroke="#A0B389" stroke-width="2"/>
    <rect x="336" y="120" width="112" height="22" rx="6" fill="#A0B389" opacity="0.22"/>
    <rect x="347" y="127" width="34" height="8" rx="2" fill="#FAFBFC" opacity="0.85"/>
    <rect x="395" y="127" width="42" height="8" rx="2" fill="#FAFBFC" opacity="0.5"/>
    <path d="M388,142 V240" stroke="#274350" stroke-width="1.5"/>
    <path d="M336,164 H448 M336,188 H448 M336,212 H448" stroke="#274350" stroke-width="1.5"/>
    <g fill="#8B8B8C">
      <rect x="347" y="150" width="28" height="6" rx="2"/><rect x="347" y="174" width="28" height="6" rx="2"/>
      <rect x="347" y="198" width="28" height="6" rx="2"/><rect x="347" y="222" width="28" height="6" rx="2"/>
    </g>
    <g fill="#A0B389" opacity="0.85">
      <rect x="398" y="150" width="34" height="6" rx="2"/><rect x="398" y="174" width="26" height="6" rx="2"/>
      <rect x="398" y="198" width="34" height="6" rx="2"/><rect x="398" y="222" width="22" height="6" rx="2"/>
    </g>
    <circle cx="440" cy="124" r="15" fill="#A0B389" stroke="#13242e" stroke-width="2.5"/>
    <path d="M433,124 L438,129 L448,118" stroke="#15252f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- OUTPUT 4 (bottom): dashboard / insights (bar + trend) -->
  <g>
    <rect x="160" y="300" width="196" height="104" rx="6" fill="#13242e" stroke="#A0B389" stroke-width="2"/>
    <rect x="160" y="300" width="196" height="20" rx="6" fill="#A0B389" opacity="0.22"/>
    <rect x="172" y="306" width="40" height="8" rx="2" fill="#FAFBFC" opacity="0.75"/>
    <rect x="316" y="306" width="28" height="8" rx="2" fill="#FAFBFC" opacity="0.45"/>
    <!-- bars -->
    <g>
      <rect x="178" y="356" width="18" height="38" rx="2" fill="#A0B389" opacity="0.85"/>
      <rect x="206" y="342" width="18" height="52" rx="2" fill="#FEDDAA" opacity="0.7"/>
      <rect x="234" y="364" width="18" height="30" rx="2" fill="#A0B389" opacity="0.85"/>
      <rect x="262" y="334" width="18" height="60" rx="2" fill="#FEDDAA" opacity="0.7"/>
      <rect x="290" y="348" width="18" height="46" rx="2" fill="#A0B389" opacity="0.85"/>
      <rect x="318" y="328" width="18" height="66" rx="2" fill="#FEDDAA" opacity="0.7"/>
    </g>
    <!-- trend line -->
    <polyline points="187,352 215,340 243,358 271,332 299,344 327,330" stroke="#FAFBFC" stroke-width="2" fill="none" opacity="0.85"/>
    <g fill="#FAFBFC"><circle cx="187" cy="352" r="2.4"/><circle cx="243" cy="358" r="2.4"/><circle cx="299" cy="344" r="2.4"/><circle cx="327" cy="330" r="2.4"/></g>
  </g>
</svg>
